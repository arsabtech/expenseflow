
name: expense_flow
description: Premium offline expense tracker - Production ready, no backend, no Firebase.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  provider: ^6.1.2
  google_fonts: ^6.2.1
  intl: ^0.19.0
  fl_chart: ^0.66.2
  url_launcher: ^6.2.5
  image_picker: ^1.0.8
  path_provider: ^2.1.2
  shared_preferences: ^2.2.2
  pdf: ^3.10.7
  csv: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
