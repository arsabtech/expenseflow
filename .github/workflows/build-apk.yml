name: Build APK - ExpenseFlow
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.3'
          channel: 'stable'
      
      - name: Auto Fix - Recreate android folder
        run: |
          rm -rf android
          flutter create . --platforms=android --org com.arsabtech --project-name expenseflow
          mkdir -p assets
          touch assets/.keep

      - run: flutter pub get
      - run: flutter build apk --release --split-per-abi

      - uses: actions/upload-artifact@v4
        with:
          name: expenseflow-apk
          path: build/app/outputs/flutter-apk/*.apk
